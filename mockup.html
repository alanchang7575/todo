<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To Do - phone mock-ups</title>
  <style>
    body { margin: 0; padding: 24px; background: #e8eaed; font-family: system-ui, sans-serif; color: #222; }
    h1 { text-align: center; font-size: 20px; margin: 0 0 24px; }
    .row { display: flex; justify-content: center; align-items: flex-start; gap: 80px; flex-wrap: wrap; }
    .device { text-align: center; }
    .device h2 { margin: 0 0 12px; font-size: 18px; }
    .device p { margin: 12px 0 0; font-size: 14px; }

    /* Each phone is drawn at real size, then scaled down to fit the page. */
    .scale { transform: scale(0.8); transform-origin: top center; }
    .holder { height: calc(var(--h) * 0.8 + 36px); }

    .phone { background: #111; padding: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.35); position: relative; }
    .screen { position: relative; overflow: hidden; background: #fff; }
    .screen iframe { border: 0; display: block; width: 100%; height: 100%; }

    /* iPhone 15: 393 x 852, rounded corners, dynamic island */
    .iphone { border-radius: 60px; }
    .iphone .screen { width: 393px; height: 852px; border-radius: 46px; }
    .iphone .island { position: absolute; top: 26px; left: 50%; transform: translateX(-50%);
      width: 120px; height: 34px; background: #000; border-radius: 20px; z-index: 2; }

    /* Galaxy S24: 360 x 780, flatter corners, centred punch-hole camera */
    .galaxy { border-radius: 40px; padding: 10px; }
    .galaxy .screen { width: 360px; height: 780px; border-radius: 30px; }
    .galaxy .punch { position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
      width: 16px; height: 16px; background: #000; border-radius: 50%; z-index: 2; }

    /* Keep the app clear of the camera cut-outs. */
    .statusbar { height: 52px; background: transparent; }
    .galaxy .statusbar { height: 40px; }
    .content { position: absolute; left: 0; right: 0; bottom: 0; top: 52px; }
    .galaxy .content { top: 40px; }
  </style>
</head>
<body>
  <h1>To Do app - phone mock-ups</h1>
  <div class="row">

    <div class="device">
      <h2>iPhone 15</h2>
      <div class="holder" style="--h: 880px">
        <div class="scale">
          <div class="phone iphone">
            <div class="island"></div>
            <div class="screen">
              <div class="statusbar"></div>
              <div class="content"><iframe src="index.html" title="iPhone preview"></iframe></div>
            </div>
          </div>
        </div>
      </div>
      <p>393 x 852</p>
    </div>

    <div class="device">
      <h2>Samsung Galaxy S24</h2>
      <div class="holder" style="--h: 800px">
        <div class="scale">
          <div class="phone galaxy">
            <div class="punch"></div>
            <div class="screen">
              <div class="statusbar"></div>
              <div class="content"><iframe src="index.html" title="Galaxy preview"></iframe></div>
            </div>
          </div>
        </div>
      </div>
      <p>360 x 780</p>
    </div>

  </div>
</body>
</html>
